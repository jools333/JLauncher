[package]
name = "jlauncher"
version = "0.2.8"
edition = "2021"
authors = ["JLauncher Contributors"]
description = "Fast, lightweight keyboard launcher for Linux (X11 & Wayland) and Windows"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "x11"] }
egui = "0.29"
global-hotkey = "0.9"
fuzzy-matcher = "0.3"
evalexpr = "13.1"
auto-launch = "0.6"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.4"
open = "5.3"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
ureq = { version = "2.10", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
semver = "1.0"

[target.'cfg(not(windows))'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
openssl = { version = "0.10", features = ["vendored"] }
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
]
